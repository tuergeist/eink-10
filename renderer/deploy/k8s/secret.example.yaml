# Copy to secret.yaml, insert the token, do not commit secret.yaml.
#
# The Grafana token belongs to a service account with the Viewer role:
#   Grafana → Administration → Users and access → Service accounts
# It may read and query; that is all the renderer needs.
apiVersion: v1
kind: Secret
metadata:
  name: eink-renderer
  namespace: eink
type: Opaque
stringData:
  GRAFANA_TOKEN: "glsa_REPLACE_ME"
